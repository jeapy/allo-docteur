<ui-page-header [title]="'finance.title' | transloco" [subtitle]="'finance.hint' | transloco" />

<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4" role="status" aria-live="polite" [attr.aria-busy]="!summary()">
  @if (summary(); as s) {
    <ui-stat-card icon="lucideTrendingUp" [label]="('finance.volume' | transloco) + ' (' + s.currency + ')'" [value]="s.volume | number: '1.0-0'" />
    <ui-stat-card icon="lucideWallet" [label]="'finance.commissions' | transloco" [value]="s.commissions | number: '1.0-0'" />
    <ui-stat-card icon="lucideCreditCard" [label]="'finance.subscriptionRevenue' | transloco" [value]="s.subscriptionRevenue | number: '1.0-0'" />
    <ui-stat-card icon="lucideShieldCheck" [label]="'finance.escrow' | transloco" [value]="s.escrow | number: '1.0-0'" />
    <ui-stat-card icon="lucideBanknote" [label]="'finance.refundedTotal' | transloco" [value]="s.refunded | number: '1.0-0'" />
    <ui-stat-card icon="lucideBanknote" [label]="'finance.pendingWithdrawals' | transloco" [value]="s.pendingWithdrawals"
      [hint]="s.pendingWithdrawalsAmount | number: '1.0-0'" [alert]="s.pendingWithdrawals > 0" />
    <ui-stat-card icon="lucideCircleAlert" [label]="'finance.pendingPayments' | transloco" [value]="s.pendingPayments" [alert]="s.pendingPayments > 0" />
  } @else {
    @for (i of [1, 2, 3, 4]; track i) { <ui-stat-card label="…" [loading]="true" /> }
  }
</div>

<ui-tabs class="mt-8" [tabs]="tabs()" [(active)]="tab" />
<div class="mt-4" role="tabpanel" [attr.aria-labelledby]="'tab-' + tab()">
  @if (tab() === 'payments') {
    <app-payments-table (changed)="refresh()" />
  } @else {
    <app-withdrawals-table (changed)="refresh()" />
  }
</div>
