<h2 brnDialogTitle class="m-0 mb-4 text-lg font-semibold text-text">{{ 'subscriptions.editPlan' | transloco }} — {{ plan.code }}</h2>
<form [formGroup]="form" (ngSubmit)="submit()" class="grid grid-cols-1 gap-4 sm:grid-cols-2">
  <ui-field class="sm:col-span-2" [label]="'subscriptions.name' | transloco" inputId="plan-name"
    [error]="form.controls.name.invalid && form.controls.name.touched ? ('validation.required' | transloco) : null">
    <input uiInput id="plan-name" formControlName="name" maxlength="100" required />
  </ui-field>
  <ui-field class="sm:col-span-2" [label]="'subscriptions.description' | transloco" inputId="plan-desc">
    <textarea uiInput id="plan-desc" rows="2" formControlName="description" maxlength="500" class="resize-y"></textarea>
  </ui-field>
  <ui-field [label]="('subscriptions.price' | transloco) + ' (' + plan.currency + ')'" inputId="plan-price"
    [error]="form.controls.price.invalid && form.controls.price.touched ? ('validation.range' | transloco) : null">
    <input uiInput id="plan-price" type="number" min="0" step="100" formControlName="price" required />
  </ui-field>
  <ui-field [label]="'subscriptions.duration' | transloco" inputId="plan-duration"
    [error]="form.controls.durationDays.invalid && form.controls.durationDays.touched ? ('validation.range' | transloco) : null">
    <input uiInput id="plan-duration" type="number" min="1" max="3650" formControlName="durationDays" required />
  </ui-field>
  @if (isProfessional) {
    <div class="sm:col-span-2">
      <ui-field [label]="'subscriptions.commissionPercent' | transloco" inputId="plan-commission"
        [error]="form.controls.commissionPercent.invalid && form.controls.commissionPercent.touched ? ('validation.range' | transloco) : null">
        <input uiInput id="plan-commission" type="number" min="0" max="100" step="0.5" formControlName="commissionPercent" />
      </ui-field>
      <p class="m-0 mt-1 text-xs text-muted">{{ 'subscriptions.commissionHint' | transloco }}</p>
    </div>
  }
  <label class="flex items-center gap-2 text-sm sm:col-span-2">
    <input type="checkbox" uiCheckbox formControlName="active" />
    {{ 'subscriptions.active' | transloco }}
  </label>
  <div class="mt-2 flex justify-end gap-2 sm:col-span-2">
    <button uiBtn variant="ghost" type="button" brnDialogClose>{{ 'common.cancel' | transloco }}</button>
    <button uiBtn type="submit">{{ 'common.save' | transloco }}</button>
  </div>
</form>
