<h2 brnDialogTitle class="m-0 mb-4 text-lg font-semibold text-text">{{ (existing ? 'pharmacies.edit' : 'pharmacies.create') | transloco }}</h2>
<form [formGroup]="form" (ngSubmit)="submit()" class="grid grid-cols-1 gap-4 sm:grid-cols-2">
  <ui-field class="sm:col-span-2" [label]="'pharmacies.name' | transloco" inputId="pm-name"
    [error]="form.controls.name.invalid && form.controls.name.touched ? ('validation.required' | transloco) : null">
    <input uiInput id="pm-name" formControlName="name" maxlength="200" required />
  </ui-field>
  <ui-select-field [label]="'pharmacies.city' | transloco" inputId="pm-city">
    <select uiSelect id="pm-city" formControlName="cityId" required>
      <option [ngValue]="0" disabled>—</option>
      @for (c of cities(); track c.id) { <option [ngValue]="c.id">{{ c.name }}</option> }
    </select>
  </ui-select-field>
  <ui-select-field [label]="'pharmacies.district' | transloco" inputId="pm-district">
    <select uiSelect id="pm-district" formControlName="districtId">
      <option [ngValue]="null">—</option>
      @for (d of districts(); track d.id) { <option [ngValue]="d.id">{{ d.name }}</option> }
    </select>
  </ui-select-field>
  <ui-field [label]="'pharmacies.phone' | transloco" inputId="pm-phone"
    [error]="form.controls.phone.invalid && form.controls.phone.touched ? ('validation.phone' | transloco) : null">
    <input uiInput id="pm-phone" formControlName="phone" inputmode="tel" required />
  </ui-field>
  <ui-field class="sm:col-span-2" [label]="'pharmacies.address' | transloco" inputId="pm-address"
    [error]="form.controls.address.invalid && form.controls.address.touched ? ('validation.required' | transloco) : null">
    <input uiInput id="pm-address" formControlName="address" maxlength="255" required />
  </ui-field>
  <ui-field [label]="'pharmacies.latitude' | transloco" inputId="pm-lat"
    [error]="form.controls.latitude.invalid && form.controls.latitude.touched ? ('validation.range' | transloco) : null">
    <input uiInput id="pm-lat" type="number" step="0.000001" formControlName="latitude" />
  </ui-field>
  <ui-field [label]="'pharmacies.longitude' | transloco" inputId="pm-lng"
    [error]="form.controls.longitude.invalid && form.controls.longitude.touched ? ('validation.range' | transloco) : null">
    <input uiInput id="pm-lng" type="number" step="0.000001" formControlName="longitude" />
  </ui-field>
  @if (coordinatesIncomplete) {
    <p class="m-0 text-sm font-medium text-danger-text sm:col-span-2" role="alert">{{ 'pharmacies.coordinatesTogether' | transloco }}</p>
  }
  <ui-field class="sm:col-span-2" [label]="'pharmacies.openingHours' | transloco" inputId="pm-hours">
    <input uiInput id="pm-hours" formControlName="openingHours" maxlength="255" />
  </ui-field>
  <label class="flex items-center gap-2 text-sm">
    <input type="checkbox" uiCheckbox formControlName="onDuty" /> {{ 'pharmacies.onDuty' | transloco }}
  </label>
  <label class="flex items-center gap-2 text-sm">
    <input type="checkbox" uiCheckbox formControlName="offersDelivery" /> {{ 'pharmacies.delivery' | transloco }}
  </label>
  @if (form.controls.offersDelivery.value) {
    <ui-field [label]="'pharmacies.deliveryFee' | transloco" inputId="pm-fee"
      [error]="form.controls.deliveryFee.invalid && form.controls.deliveryFee.touched ? ('validation.range' | transloco) : null">
      <input uiInput id="pm-fee" type="number" min="0" formControlName="deliveryFee" />
    </ui-field>
  }
  <div class="mt-2 flex justify-end gap-2 sm:col-span-2">
    <button uiBtn variant="ghost" type="button" brnDialogClose>{{ 'common.cancel' | transloco }}</button>
    <button uiBtn type="submit">{{ 'common.save' | transloco }}</button>
  </div>
</form>
