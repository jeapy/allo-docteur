<h2 brnDialogTitle class="m-0 mb-4 text-lg font-semibold text-text">{{ (existing ? 'partners.edit' : 'partners.create') | transloco }}</h2>
<form [formGroup]="form" (ngSubmit)="submit()" class="grid grid-cols-1 gap-4 sm:grid-cols-2">
  <ui-field class="sm:col-span-2" [label]="'partners.name' | transloco" inputId="pf-name"
    [error]="form.controls.name.invalid && form.controls.name.touched ? ('validation.required' | transloco) : null">
    <input uiInput id="pf-name" formControlName="name" maxlength="150" required />
  </ui-field>
  <ui-select-field [label]="'partners.type' | transloco" inputId="pf-type">
    <select uiSelect id="pf-type" formControlName="type" required>
      @for (t of types; track t) { <option [value]="t">{{ 'partnerTypes.' + t | transloco }}</option> }
    </select>
  </ui-select-field>
  <ui-select-field [label]="'partners.city' | transloco" inputId="pf-city">
    <select uiSelect id="pf-city" formControlName="cityId">
      <option [ngValue]="null">—</option>
      @for (c of cities(); track c.id) { <option [ngValue]="c.id">{{ c.name }}</option> }
    </select>
  </ui-select-field>
  <ui-field class="sm:col-span-2" [label]="'partners.address' | transloco" inputId="pf-address">
    <input uiInput id="pf-address" formControlName="address" maxlength="255" />
  </ui-field>
  <ui-field [label]="'partners.email' | transloco" inputId="pf-email"
    [error]="form.controls.contactEmail.invalid && form.controls.contactEmail.touched ? ('validation.email' | transloco) : null">
    <input uiInput id="pf-email" type="email" formControlName="contactEmail" />
  </ui-field>
  <ui-field [label]="'partners.phone' | transloco" inputId="pf-phone"
    [error]="form.controls.contactPhone.invalid && form.controls.contactPhone.touched ? ('validation.phone' | transloco) : null">
    <input uiInput id="pf-phone" formControlName="contactPhone" inputmode="tel" />
  </ui-field>
  <ui-field [label]="'partners.contractStart' | transloco" inputId="pf-start">
    <input uiInput id="pf-start" type="date" formControlName="contractStartDate" />
  </ui-field>
  <div class="mt-2 flex justify-end gap-2 sm:col-span-2">
    <button uiBtn variant="ghost" type="button" brnDialogClose>{{ 'common.cancel' | transloco }}</button>
    <button uiBtn type="submit">{{ 'common.save' | transloco }}</button>
  </div>
</form>
