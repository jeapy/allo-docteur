spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  application:
    name: allo-docteur
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/allodocteur}
    username: ${DB_USER:allodocteur}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  jwt:
    secret: ${APP_JWT_SECRET}
    issuer: allo-docteur
    access-ttl: 15m
    refresh-ttl: 30d
    mfa-ttl: 5m
  crypto:
    key: ${APP_CRYPTO_KEY}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:4200}
  cookie:
    secure: ${APP_COOKIE_SECURE:true}
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
  rate-limit:
    auth-per-minute: 10
  security:
    require-admin-mfa: ${APP_REQUIRE_ADMIN_MFA:true}  # admins SUPER/FINANCE : 2FA obligatoire (seul /auth/** reste ouvert avant l'enrôlement)
  storage:
    local-path: ${APP_STORAGE_PATH:./data/storage}
  notifications:
    external-types: APPOINTMENT_REMINDER,SOS,PRESCRIPTION,COMPLAINT_UPDATE  # doublés d'un push/SMS/e-mail (stubs)
    reminder-minutes: 60
  payments:
    commission-rate: 0.10            # commission sur les consultations (surchargée par le plan d'abonnement du professionnel)
    pharmacy-commission-rate: 0
    require-payment-to-confirm: true # un rendez-vous payant doit être réglé avant sa confirmation
    min-withdrawal: 1000
    min-topup: 500
    max-topup: 1000000
  subscriptions:
    trial-days: 30
    trial-plan-code: PRO_STANDARD
