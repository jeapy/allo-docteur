services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-allodocteur}
      POSTGRES_USER: ${DB_USER:-allodocteur}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-allodocteur} -d ${DB_NAME:-allodocteur}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-allodocteur}
      DB_USER: ${DB_USER:-allodocteur}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET requis}
      APP_CRYPTO_KEY: ${APP_CRYPTO_KEY:?APP_CRYPTO_KEY requis}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_REQUIRE_ADMIN_MFA: ${APP_REQUIRE_ADMIN_MFA:-true}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:8081}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:8081}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  admin:
    build: ./admin
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  pgdata:
